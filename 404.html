  <title>Page Not Found | Ken Holman</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f2240">
  <meta name="author" content="Ken Holman">
  <!-- Absolute paths: this page is served at any bad URL, at any depth -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    :root {
      --color-navy:         #0f2240;
      --color-navy-mid:     #1a3560;
      --color-accent:       #2e7dd1;
      --color-accent-light: #4a9ae8;
      --color-white:        #ffffff;

      --font-heading: Georgia, 'Times New Roman', serif;
      --font-body:    'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --font-mono:    'Consolas', 'Courier New', Courier, monospace;

      --radius: 6px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      color: var(--color-white);
      background-color: var(--color-navy);
      background-image:
        radial-gradient(ellipse at 20% 60%, rgba(46, 125, 209, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(26, 53, 96, 0.6) 0%, transparent 55%);
      display: flex;
      align-items: center;
    }

    :focus-visible {
      outline: 3px solid var(--color-accent-light);
      outline-offset: 3px;
    }

    main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    .kicker {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent-light);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.7);
      max-width: 600px;
      margin-bottom: 2.5rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      border: 2px solid transparent;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-white);
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background-color: var(--color-accent-light);
      border-color: var(--color-accent-light);
      box-shadow: 0 4px 14px rgba(46, 125, 209, 0.4);
    }

    .btn-outline {
      background-color: transparent;
      border-color: rgba(255, 255, 255, 0.4);
      color: var(--color-white);
    }

    .btn-outline:hover,
    .btn-outline:focus {
      border-color: var(--color-white);
      background-color: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 600px) {
      .actions {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="kicker">Error 404</span>
    <h1>Page not found</h1>
    <p>
      Nothing lives at this address. The page may have moved, or the link
      may have a typo in it.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Go to homepage</a>
      <a class="btn btn-outline" href="/#projects">View projects</a>
    </div>
  </main>
</body>
</html>
